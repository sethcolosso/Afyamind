<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Community — AfyaMind</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="header-container"></div>

<div class="community-layout">
  <!-- Sidebar -->
  <div class="groups-sidebar">
    <input class="search-input" placeholder="🔍 Find a group..." id="search-input">

    <div style="margin:20px 0 10px;">
      <button class="btn btn-primary" onclick="createNewForum()" style="width:100%;">
        + Create New Forum
      </button>
    </div>

    <h3>My Groups</h3>
    <div id="my-groups"></div>

    <h3>Suggested</h3>
    <div id="suggested-groups"></div>
  </div>

  <!-- Main Feed / Chat Area -->
  <div class="feed-main">
    <div class="group-header-bar" id="group-header">
      <div class="group-header-info">
        <h2 id="group-title">Select a group</h2>
        <p id="group-subtitle">Join the conversation</p>
      </div>
      <div style="display:flex;gap:8px;" id="header-actions"></div>
    </div>

    <div id="login-banner" class="login-banner" style="display:none;">
      👋 You're viewing as a guest. <a href="login.html">Log in</a> to post, comment, and like.
    </div>

    <!-- Posts -->
    <div class="chat-messages" id="chat-messages">
      <!-- Posts loaded by JS -->
    </div>

    <!-- Post Input -->
    <div class="chat-input-area" id="chat-input-area" style="display:none;">
      <input type="text" id="message-input" placeholder="Share something with the group..."
             onkeypress="if(event.key === 'Enter') sendMessage()">
      <button onclick="sendMessage()" class="btn btn-primary">Send</button>
    </div>
  </div>
</div>

<script src="common.js"></script>
<script>
// ── Config ──────────────────────────────────────────────────
const API_BASE = 'http://localhost:3001'; // change if your backend runs elsewhere

let groups = [];
let currentGroupId = null;
let currentPosts = [];
let openCommentsFor = null; // post id currently showing its comment thread

function getToken() { return localStorage.getItem('afya_token'); }
function isLoggedIn() { return !!getToken(); }
function authHeaders() {
  const token = getToken();
  return {
    'Content-Type': 'application/json',
    ...(token ? { Authorization: `Bearer ${token}` } : {})
  };
}

async function api(path, options = {}) {
  const res = await fetch(`${API_BASE}${path}`, {
    ...options,
    headers: { ...authHeaders(), ...(options.headers || {}) }
  });
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    throw new Error(body.error || `Request failed (${res.status})`);
  }
  return res.status === 204 ? null : res.json();
}

function requireLogin(message) {
  if (isLoggedIn()) return true;
  if (confirm(`${message}\n\nLog in now?`)) window.location.href = 'login.html';
  return false;
}

// ── Load & render groups ───────────────────────────────────
async function loadGroups() {
  try {
    groups = await api('/api/groups');
  } catch (err) {
    console.error('Failed to load groups:', err);
    groups = [];
  }
  renderGroups();
}

function renderGroups() {
  const myGroups = document.getElementById('my-groups');
  const suggested = document.getElementById('suggested-groups');
  const query = document.getElementById('search-input').value.trim().toLowerCase();

  myGroups.innerHTML = '';
  suggested.innerHTML = '';

  groups
    .filter(g => !query || g.title.toLowerCase().includes(query))
    .forEach(g => {
      const div = document.createElement('div');
      div.className = `group-item ${currentGroupId === g.id ? 'active' : ''}`;
      div.innerHTML = `
        <div class="group-icon" style="background:var(--primary-light);">${g.icon}</div>
        <div>
          <div class="group-name">${g.title}</div>
          <div class="group-members">${g.member_count} members · ${g.views_count || 0} views</div>
        </div>
        ${g.joined ? '<div class="unread-badge">Joined</div>' : ''}
      `;
      div.onclick = () => openGroup(g.id);
      (g.joined ? myGroups : suggested).appendChild(div);
    });

  if (!myGroups.children.length) myGroups.innerHTML = '<p class="empty-hint">No groups joined yet.</p>';
}

document.getElementById('search-input').addEventListener('input', renderGroups);

// ── Open a group ────────────────────────────────────────────
async function openGroup(groupId) {
  currentGroupId = groupId;
  const group = groups.find(g => g.id === groupId);
  if (!group) return;

  document.getElementById('group-title').textContent = group.title;
  document.getElementById('group-subtitle').textContent =
    `${group.member_count} members · ${group.views_count || 0} views · ${group.moderated ? 'Moderated' : 'Open'}`;

  const headerActions = document.getElementById('header-actions');
  if (!isLoggedIn()) {
    headerActions.innerHTML = `<button class="btn btn-primary" onclick="requireLogin('Log in to join this group.')">Join Group</button>`;
  } else if (group.joined) {
    headerActions.innerHTML = `<button class="btn btn-secondary" style="font-size:13px;padding:7px 16px;" disabled>Joined</button>`;
  } else {
    headerActions.innerHTML = `<button class="btn btn-primary" onclick="joinGroup('${group.id}')">Join Group</button>`;
  }

  document.getElementById('login-banner').style.display = isLoggedIn() ? 'none' : 'flex';
  document.getElementById('chat-input-area').style.display = (isLoggedIn() && group.joined) ? 'flex' : 'none';

  // Count this as a view (fire-and-forget, works for guests too)
  api(`/api/groups/${groupId}/view`, { method: 'POST' }).then(() => {
    group.views_count = (group.views_count || 0) + 1;
  }).catch(() => {});

  await loadPosts(groupId);
  renderGroups();
}

async function loadPosts(groupId) {
  const container = document.getElementById('chat-messages');
  container.innerHTML = '<p class="empty-hint">Loading...</p>';
  try {
    currentPosts = await api(`/api/groups/${groupId}/posts`);
  } catch (err) {
    container.innerHTML = `<p class="empty-hint">Couldn't load posts: ${err.message}</p>`;
    return;
  }
  renderPosts();
}

function renderPosts() {
  const container = document.getElementById('chat-messages');
  container.innerHTML = '';

  if (!currentPosts.length) {
    container.innerHTML = '<p class="empty-hint">No posts yet — be the first to share.</p>';
    return;
  }

  currentPosts.forEach(post => {
    const div = document.createElement('div');
    div.className = 'feed-post';
    div.innerHTML = `
      <div class="post-header">
        <div class="anon-avatar" style="background:var(--primary-light);">👤</div>
        <div>
          <div class="post-author" style="color:var(--primary);">${post.author_name}</div>
          <div class="post-time">${new Date(post.created_at).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' })}</div>
        </div>
      </div>
      <p class="post-text">${escapeHtml(post.text)}</p>

      <div class="reactions">
        <span class="reaction-item ${post.liked_by_me ? 'liked' : ''}" onclick="toggleLike('${post.id}')">
          ❤️ <small>${post.like_count}</small>
        </span>
        <span class="reaction-item" onclick="toggleComments('${post.id}')">
          💬 <small>${post.comment_count}</small>
        </span>
      </div>

      <div class="comment-thread" id="comments-${post.id}" style="display:${openCommentsFor === post.id ? 'block' : 'none'};"></div>
    `;
    container.appendChild(div);
  });

  if (openCommentsFor) loadComments(openCommentsFor);
  container.scrollTop = container.scrollHeight;
}

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

// ── Join / Post / Like / Comment ───────────────────────────
async function joinGroup(groupId) {
  if (!requireLogin('Log in to join this group.')) return;
  try {
    await api(`/api/groups/${groupId}/join`, { method: 'POST' });
    const group = groups.find(g => g.id === groupId);
    group.joined = true;
    group.member_count += 1;
    openGroup(groupId);
  } catch (err) {
    alert(err.message);
  }
}

async function sendMessage() {
  if (!requireLogin('Log in to post in this group.')) return;
  const input = document.getElementById('message-input');
  const text = input.value.trim();
  if (!text || !currentGroupId) return;

  try {
    await api(`/api/groups/${currentGroupId}/posts`, {
      method: 'POST',
      body: JSON.stringify({ text })
    });
    input.value = '';
    await loadPosts(currentGroupId);
  } catch (err) {
    alert(err.message);
  }
}

async function toggleLike(postId) {
  if (!requireLogin('Log in to like posts.')) return;
  try {
    const result = await api(`/api/posts/${postId}/like`, { method: 'POST' });
    const post = currentPosts.find(p => p.id === postId);
    if (post) { post.liked_by_me = result.liked; post.like_count = result.like_count; }
    renderPosts();
  } catch (err) {
    alert(err.message);
  }
}

function toggleComments(postId) {
  openCommentsFor = openCommentsFor === postId ? null : postId;
  renderPosts();
}

async function loadComments(postId) {
  const el = document.getElementById(`comments-${postId}`);
  if (!el) return;
  el.innerHTML = '<p class="empty-hint">Loading comments...</p>';
  try {
    const comments = await api(`/api/posts/${postId}/comments`);
    el.innerHTML = `
      ${comments.map(c => `
        <div class="comment-item">
          <strong>${c.author_name}</strong>
          <span>${escapeHtml(c.text)}</span>
        </div>`).join('') || '<p class="empty-hint">No comments yet.</p>'}
      ${isLoggedIn() ? `
        <div class="comment-input-row">
          <input type="text" placeholder="Write a comment..." id="comment-input-${postId}"
                 onkeypress="if(event.key === 'Enter') submitComment('${postId}')">
          <button class="btn btn-secondary" style="padding:6px 14px;font-size:13px;" onclick="submitComment('${postId}')">Reply</button>
        </div>` : `<p class="empty-hint"><a href="login.html">Log in</a> to comment.</p>`}
    `;
  } catch (err) {
    el.innerHTML = `<p class="empty-hint">Couldn't load comments.</p>`;
  }
}

async function submitComment(postId) {
  const input = document.getElementById(`comment-input-${postId}`);
  const text = input.value.trim();
  if (!text) return;
  try {
    await api(`/api/posts/${postId}/comments`, {
      method: 'POST',
      body: JSON.stringify({ text })
    });
    input.value = '';
    const post = currentPosts.find(p => p.id === postId);
    if (post) post.comment_count += 1;
    await loadComments(postId);
    renderPosts();
  } catch (err) {
    alert(err.message);
  }
}

async function createNewForum() {
  if (!requireLogin('Log in to create a forum.')) return;

  const title = prompt("Enter new forum name:");
  if (!title) return;

  try {
    const group = await api('/api/groups', {
      method: 'POST',
      body: JSON.stringify({ title })
    });
    await loadGroups();
    openGroup(group.id);
  } catch (err) {
    alert(err.message);
  }
}

// ── Initialize ──────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', async () => {
  fetch('header.html').then(r => r.text()).then(html => {
    document.getElementById('header-container').innerHTML = html;
  }).catch(() => {});

  await loadGroups();
  const firstJoined = groups.find(g => g.joined) || groups[0];
  if (firstJoined) openGroup(firstJoined.id);
});
</script>

<style>
.reactions {
  margin-top: 12px;
  display: flex;
  gap: 16px;
  font-size: 16px;
}
.reaction-item {
  cursor: pointer;
  transition: transform 0.2s;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.reaction-item:hover { transform: scale(1.15); }
.reaction-item.liked { color: #d94f4f; font-weight: 700; }

.login-banner {
  background: var(--primary-light, #dce8df);
  color: var(--primary, #5b7f6a);
  padding: 10px 16px;
  border-radius: 10px;
  font-size: 13.5px;
  margin-bottom: 12px;
  display: flex;
  gap: 6px;
}
.login-banner a { color: var(--primary, #5b7f6a); font-weight: 700; }

.empty-hint { color: var(--text-sec, #5f5c50); font-size: 13.5px; font-style: italic; padding: 8px 0; }

.comment-thread {
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid #e8e2cd;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.comment-item { font-size: 13.5px; background: #faf7ec; border-radius: 8px; padding: 8px 12px; }
.comment-item strong { margin-right: 6px; color: var(--primary, #5b7f6a); }
.comment-input-row { display: flex; gap: 8px; margin-top: 4px; }
.comment-input-row input {
  flex: 1; border: 1px solid #e8e2cd; border-radius: 8px; padding: 7px 10px; font-size: 13.5px; font-family: inherit;
}
</style>
</body>
</html>
