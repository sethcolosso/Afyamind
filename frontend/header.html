      <button class="btn btn-secondary" onclick="logout()" style="font-size:14px;padding:9px 18px;">Logout</button>

    <!-- Not logged in -->
    <div id="nav-logged-out" style="display:flex; gap:12px; flex-direction:row; align-items:center;">

    </div>

  <script>
    function updateNavAuth() {
      const token = localStorage.getItem('afya_token');
      
      const loggedInDiv = document.getElementById('nav-logged-in');
      const loggedOutDiv = document.getElementById('nav-logged-out');

      console.log('Header: Token present =', !!token);

      if (token) {
        if (loggedInDiv) loggedInDiv.style.display = 'flex';
        if (loggedOutDiv) loggedOutDiv.style.display = 'none';
        console.log('✅ Showing Dashboard + Logout');
      } else {
        if (loggedInDiv) loggedInDiv.style.display = 'none';
        if (loggedOutDiv) loggedOutDiv.style.display = 'flex';
        console.log('✅ Showing Login + Sign Up');
      }
    }

    // Run when header loads
    document.addEventListener('DOMContentLoaded', updateNavAuth);
    
    // Also update when user comes back to tab
    document.addEventListener('visibilitychange', updateNavAuth);
  </script>
</nav>
